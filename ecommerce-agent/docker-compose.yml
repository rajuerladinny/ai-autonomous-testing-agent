services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ecommerce_pg:/var/lib/postgresql/data
volumes:
  ecommerce_pg:
