name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Pinned: the pinned Playwright release cannot install Chromium dependencies on Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run install:browser
      - run: npm run build
      - run: npm test
        env:
          # Synthetic fixtures only; the application keeps its sandbox enabled.
          CHROMIUM_SANDBOX: 'false'
          CAPTURE_UI_SCREENSHOT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-screenshot
          path: artifacts/workspace.png
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run check:secrets
      - run: npm audit --audit-level=moderate
