name: Verify MVP
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run install:browser
      - run: npm run build
      - run: npm test
        env:
          # Synthetic fixtures only; the application keeps its sandbox enabled.
          CHROMIUM_SANDBOX: 'false'
      - run: npm run check:secrets
      - run: npm audit --audit-level=moderate
