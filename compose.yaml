services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs first}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['agent-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  agent-data:
